name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm run audit:deps

      - name: Prepare NAS bundle
        run: npm run nas:bundle:prepare

      - name: Check whitespace
        run: git diff --check

  nas-docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Prepare NAS bundle
        run: npm run nas:bundle:prepare

      - name: Build NAS Docker image
        run: npm run nas:bundle:docker-build
